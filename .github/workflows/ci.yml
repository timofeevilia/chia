name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chia
          POSTGRES_PASSWORD: chia
          POSTGRES_DB: chia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chia" --health-interval 2s --health-timeout 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generated code is up to date with the OpenAPI spec
        run: |
          go generate ./...
          git diff --exit-code

      - name: Migrations apply, roll back and re-apply
        env:
          DATABASE_URL: postgres://chia:chia@localhost:5432/chia?sslmode=disable
        run: |
          go run ./cmd/chia migrate up
          go run ./cmd/chia migrate down
          go run ./cmd/chia migrate up

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://chia:chia@localhost:5432/chia?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/1
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  loadtest:
    # Builds the production image, starts the stack with Compose and runs k6
    # against it. The run fails if latency thresholds or ledger invariants break.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        env:
          RATE_LIMIT_PER_MINUTE: "0"
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 2; done
      - uses: grafana/setup-k6-action@v1
      - name: Run k6
        env:
          VUS: "30"
          DURATION: 30s
        run: k6 run --summary-export=k6-summary.json loadtest/ledger.js
      - name: API logs on failure
        if: failure()
        run: docker compose logs api | tail -100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types are up to date with the OpenAPI spec
        run: |
          npm run generate
          git diff --exit-code
      - run: npm run check
      - run: npm test
      - name: Build
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://api.chia.krolikx.com' }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build
          include-hidden-files: true

  deploy:
    # Production deploy: only from main, only after every check above is green.
    needs: [test, lint, loadtest, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null
          echo "Render deploy triggered." >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    # Static files go to the web host over SSH. The host key is pinned through
    # a secret, so the runner never trusts an unknown server.
    needs: [test, lint, loadtest, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.WEB_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.WEB_SSH_KNOWN_HOSTS }}
      SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
      SSH_USER: ${{ secrets.WEB_SSH_USER }}
      SSH_PORT: ${{ secrets.WEB_SSH_PORT }}
      TARGET_DIR: ${{ vars.WEB_TARGET_DIR || 'public_html/chia.krolikx.com' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build
      - name: Upload to web host
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "Web host secrets are not set; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=yes -o BatchMode=yes $SSH_USER@$SSH_HOST"
          # Old fingerprinted assets are removed; everything else is overwritten in place.
          tar -C build -czf - . | $SSH "mkdir -p '$TARGET_DIR' && rm -rf '$TARGET_DIR/_app' && tar -xzf - -C '$TARGET_DIR'"
          echo "Web app deployed." >> "$GITHUB_STEP_SUMMARY"
